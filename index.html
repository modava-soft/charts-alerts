<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>۱۲ نمودار زنده با SMA و WMA + الرت</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
    body { background:#111; color:#eee; font-family:sans-serif; direction:rtl; }
    .grid {
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 260px;
        gap: 8px;
        padding: 10px;
    }
    .chart {
        border:1px solid #333;
        border-radius:6px;
        position:relative;
    }
    .title {
        position:absolute;
        top:2px;
        left:4px;
        font-size:12px;
        color:#ccc;
    }
    #log {
        background:#000;
        padding:10px;
        margin:10px;
        border-radius:6px;
        height:150px;
        overflow-y:auto;
        font-size:12px;
    }
</style>
</head>

<body>

<h2 style="text-align:center;">۱۲ نمودار زنده با SMA و WMA + الرت تغییر جهت</h2>

<div id="log"></div>

<div class="grid" id="charts"></div>

<script>
// -------------------------
// تنظیمات اولیه
// -------------------------
const symbols = [
  "BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT",
  "XRPUSDT","ADAUSDT","DOGEUSDT","TRXUSDT",
  "MATICUSDT","LINKUSDT","LTCUSDT","ATOMUSDT"
];

const iranOffset = 12600; // زمان ایران

// -------------------------
// توابع محاسبه SMA
// -------------------------
function SMA(data, period) {
    let result = [];
    for (let i = 0; i < data.length; i++) {
        if (i < period) {
            result.push(null);
            continue;
        }
        let sum = 0;
        for (let j = i - period; j < i; j++) {
            sum += data[j].close;
        }
        result.push(sum / period);
    }
    return result;
}

// -------------------------
// محاسبه WMA
// -------------------------
function WMA(data, period) {
    let result = [];
    for (let i = 0; i < data.length; i++) {
        if (i < period) {
            result.push(null);
            continue;
        }
        let sum = 0;
        let weightSum = 0;
        for (let j = 0; j < period; j++) {
            sum += data[i - j].close * (period - j);
            weightSum += (period - j);
        }
        result.push(sum / weightSum);
    }
    return result;
}

// -------------------------
// ثبت پیام در لاگ
// -------------------------
function log(msg) {
    const div = document.getElementById("log");
    const line = document.createElement("div");
    const now = new Date().toLocaleTimeString("fa-IR");
    line.textContent = `[${now}] ${msg}`;
    div.prepend(line);
}

// -------------------------
// ساخت ۱۲ نمودار
// -------------------------
const chartsDiv = document.getElementById("charts");

symbols.forEach(symbol => {
    const box = document.createElement("div");
    box.className = "chart";
    box.id = "chart-" + symbol;

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = symbol;

    box.appendChild(title);
    chartsDiv.appendChild(box);

    const chart = LightweightCharts.createChart(box, {
        width: box.clientWidth,
        height: box.clientHeight,
        layout: { backgroundColor:'#111', textColor:'#ccc' },
        grid: { vertLines:{color:'#333'}, horzLines:{color:'#333'} },
        timeScale: { timeVisible:true }
    });

    const candleSeries = chart.addCandlestickSeries();
    const sma10Series = chart.addLineSeries({ color:'#888' });
    const sma50Series = chart.addLineSeries({ color:'#aaa' });
    const sma100Series = chart.addLineSeries({ color:'#ccc' });
    const sma200Series = chart.addLineSeries({ color:'#fff' });

    const wmaSeries = chart.addLineSeries({ color:'yellow', lineWidth:2 });

    let candles = [];
    let lastWMA = null;

    const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_15m`);

    ws.onmessage = (event) => {
        const k = JSON.parse(event.data).k;

        const candle = {
            time: (k.t / 1000) + iranOffset,
            open: parseFloat(k.o),
            high: parseFloat(k.h),
            low: parseFloat(k.l),
            close: parseFloat(k.c)
        };

        candles.push(candle);
        candleSeries.update(candle);

        if (candles.length < 210) return;

        const sma10 = SMA(candles, 10);
        const sma50 = SMA(candles, 50);
        const sma100 = SMA(candles, 100);
        const sma200 = SMA(candles, 200);
        const wma = WMA(candles, 20);

        sma10Series.setData(candles.map((c,i)=>({time:c.time, value:sma10[i]})));
        sma50Series.setData(candles.map((c,i)=>({time:c.time, value:sma50[i]})));
        sma100Series.setData(candles.map((c,i)=>({time:c.time, value:sma100[i]})));
        sma200Series.setData(candles.map((c,i)=>({time:c.time, value:sma200[i]})));

        const last = wma[wma.length - 1];
        const prev = wma[wma.length - 2];

        if (last && prev) {
            if (last > prev) {
                wmaSeries.applyOptions({ color:'lime' });
                if (lastWMA !== "up") {
                    log(`${symbol}: WMA صعودی شد`);
                    lastWMA = "up";
                }
            } else {
                wmaSeries.applyOptions({ color:'red' });
                if (lastWMA !== "down") {
                    log(`${symbol}: WMA نزولی شد`);
                    lastWMA = "down";
                }
            }
        }

        wmaSeries.setData(candles.map((c,i)=>({time:c.time, value:wma[i]})));
    };
});
</script>

</body>
</html>
