<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>۱۲ نمودار زنده با WMA رنگی</title>

<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>
    body {
        background:#111;
        color:#eee;
        font-family:sans-serif;
        direction:rtl;
        margin:0;
        padding:0;
    }

    .grid {
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding: 10px;
    }

    .chart {
        border:1px solid #333;
        border-radius:6px;
        position:relative;
        height:260px; /* مهم */
    }

    .title {
        position:absolute;
        top:4px;
        left:6px;
        font-size:13px;
        color:#ccc;
        z-index:10;
    }
</style>
</head>

<body>

<h2 style="text-align:center; padding:10px;">۱۲ نمودار زنده با WMA رنگی</h2>

<div class="grid" id="charts"></div>

<script>
// -------------------------
// تنظیمات اولیه
// -------------------------
const symbols = [
  "BTCUSDT","ETHUSDT","BNBUSDT","SOLUSDT",
  "XRPUSDT","ADAUSDT","DOGEUSDT","TRXUSDT",
  "MATICUSDT","LINKUSDT","LTCUSDT","ATOMUSDT"
];

const iranOffset = 12600; // زمان ایران

// -------------------------
// محاسبه WMA
// -------------------------
function WMA(data, period) {
    let result = [];
    for (let i = 0; i < data.length; i++) {
        if (i < period) {
            result.push(null);
            continue;
        }
        let sum = 0;
        let weightSum = 0;
        for (let j = 0; j < period; j++) {
            sum += data[i - j].close * (period - j);
            weightSum += (period - j);
        }
        result.push(sum / weightSum);
    }
    return result;
}

// -------------------------
// ساخت ۱۲ نمودار
// -------------------------
const chartsDiv = document.getElementById("charts");

symbols.forEach(symbol => {
    const box = document.createElement("div");
    box.className = "chart";
    box.id = "chart-" + symbol;

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = symbol;

    box.appendChild(title);
    chartsDiv.appendChild(box);

    const chart = LightweightCharts.createChart(box, {
        width: box.clientWidth,
        height: box.clientHeight,
        layout: { backgroundColor:'#111', textColor:'#ccc' },
        grid: { vertLines:{color:'#333'}, horzLines:{color:'#333'} },
        timeScale: { timeVisible:true }
    });

    const candleSeries = chart.addCandlestickSeries();
    const wmaUpSeries   = chart.addLineSeries({ color:'lime', lineWidth:2 });
    const wmaDownSeries = chart.addLineSeries({ color:'red', lineWidth:2 });

    let candles = [];

    const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_15m`);

    ws.onmessage = (event) => {
        const k = JSON.parse(event.data).k;

        const candle = {
            time: (k.t / 1000) + iranOffset,
            open: parseFloat(k.o),
            high: parseFloat(k.h),
            low: parseFloat(k.l),
            close: parseFloat(k.c)
        };

        candles.push(candle);
        candleSeries.update(candle);

        if (candles.length < 50) return;

        const wma = WMA(candles, 20);

        const wmaUp   = [];
        const wmaDown = [];

        for (let i = 1; i < wma.length; i++) {
            if (wma[i] === null) {
                wmaUp.push({ time:candles[i].time, value:null });
                wmaDown.push({ time:candles[i].time, value:null });
                continue;
            }

            if (wma[i] > wma[i-1]) {
                wmaUp.push({ time:candles[i].time, value:wma[i] });
                wmaDown.push({ time:candles[i].time, value:null });
            } else {
                wmaUp.push({ time:candles[i].time, value:null });
                wmaDown.push({ time:candles[i].time, value:wma[i] });
            }
        }

        wmaUpSeries.setData(wmaUp);
        wmaDownSeries.setData(wmaDown);
    };
});
</script>

</body>
</html>
